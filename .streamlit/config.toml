[server]
# Matches the 10 MB per-file limit enforced in app.py and the API.
maxUploadSize = 10
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#6366f1"
backgroundColor = "#f8faff"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"
